<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problem-Solving Diary</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <h1>Problem-Solving Diary (dd)</h1>

    <fieldset id="form-fieldset">
      <legend id="form-legend">New Entry</legend>
      <form id="diary-form">
        <label
          >Tag &amp; Title
          <input
            type="text"
            name="tag"
            placeholder="[dd-2026-10-03] Title"
            required
          />
        </label>
        <label
          >Symptom
          <textarea name="symptom" rows="2" required></textarea>
        </label>
        <label
          >Tried
          <textarea name="tried" rows="2" required></textarea>
        </label>
        <label
          >Root Cause
          <textarea name="rootCause" rows="2" required></textarea>
        </label>
        <label
          >Fix
          <textarea name="fix" rows="2" required></textarea>
        </label>
        <label
          >Lesson
          <textarea name="lesson" rows="1" required></textarea>
        </label>
        <button type="submit">Save Entry</button>
        <button type="button" id="cancel-edit" style="display: none">
          Cancel
        </button>
      </form>
    </fieldset>

    <div>
      <input
        type="search"
        id="search-input"
        placeholder="Search by title or tag..."
      />
    </div>

    <div id="entries"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
